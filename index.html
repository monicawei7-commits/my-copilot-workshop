<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
    ![工作坊完成徽章](https://img.shields.io/badge/GitHub_Copilot_實戰工作坊-已完成-1F883D?style=for-the-badge&logo=githubcopilot&logoColor=white)
    <main class="todo-card">
        <header class="todo-header">
            <p class="eyebrow">TODAY'S FOCUS</p>
            <div class="title-row">
                <h1>待辦清單</h1>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
                    <span aria-hidden="true">🌙</span> 深色模式
                </button>
            </div>
            <p class="subtitle">把重要的事，一件一件完成。</p>
        </header>

        <form class="todo-form" id="todo-form">
            <label class="sr-only" for="todo-input">新增待辦事項</label>
            <input id="todo-input" name="todo" type="text" placeholder="接下來要完成什麼？" autocomplete="off">
            <button type="submit">新增</button>
        </form>

        <nav class="filter-bar" aria-label="待辦事項篩選">
            <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
        </nav>

        <section class="todo-section" aria-live="polite">
            <ul class="todo-list" id="todo-list"></ul>
            <p class="empty-state" id="empty-state">還沒有任何待辦事項,新增一個吧!</p>
        </section>

        <footer class="todo-footer">
            <span id="remaining-count">未完成:0 項</span>
            <button class="clear-completed" id="clear-completed" type="button" aria-label="清除所有已完成的待辦事項">清除已完成</button>
        </footer>
    </main>
</body>

</html>
